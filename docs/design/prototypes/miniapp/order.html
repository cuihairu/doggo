<!doctype html>
<html lang="zh-CN" data-theme="brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 小程序 下单与开箱 — doggo</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="card row between" style="max-width:520px;margin:14px auto 10px;padding:8px 14px;">
  <span class="mini muted">小程序端 · 关键动作：确认订单 → 开箱结果（opening 页）</span>
  <span class="row"><select class="theme-switch" aria-label="主题"></select><a class="mini" href="home.html">返回</a></span>
</div>

<div class="phone-wrap">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>doggo · 小程序</span><span>◍</span></div>
    <div class="appbar">
      <span class="row" style="gap:6px;"><i class="ico sm ico-back"></i><b>确认订单</b></span>
      <span class="badge err mini"><i class="ico sm ico-clock"></i>14:32</span>
    </div>
    <div class="screen">
      <div class="proto-note mini">对应实现：小程序下单流程 + opening/opening.tsx（开箱结果动画）。支付走 mock 渠道；本页示范「订单已建、待支付」状态。</div>

      <div class="card row" style="gap:10px;">
        <span class="ph" style="width:52px;height:52px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)"><i class="ico ico-box"></i></span>
        <span class="grow"><b>梦魇武器箱 · 单开</b><p class="mini muted">金币 −50 · 券 −¥2.00</p></span>
        <b class="money">¥ 10.80</b>
      </div>

      <div class="card">
        <p class="label" style="margin-bottom:6px;">支付方式</p>
        <label class="row between" style="padding:6px 0;">
          <span class="row"><i class="ico sm ico-wallet" style="color:var(--primary)"></i><b class="mini">微信（模拟）</b></span>
          <span class="badge ok">已选</span>
        </label>
        <label class="row between" style="padding:6px 0;border-top:1px dashed var(--border);">
          <span class="row"><i class="ico sm ico-wallet" style="color:var(--muted)"></i><b class="mini">支付宝（待接入）</b></span>
          <span class="badge mut">不可用</span>
        </label>
      </div>

      <div class="card pay-cta">
        <p class="mini muted">应付金额</p>
        <p class="money" style="font-size:24px;color:var(--primary);">¥ 10.80</p>
        <button class="btn block" style="min-height:42px;">立即支付</button>
        <p class="mini muted" style="text-align:center;margin-top:6px;">超时未支付订单自动取消</p>
      </div>

      <div class="sec-head"><span>开箱结果（支付后进入）</span></div>
      <div class="open-result">
        <div class="open-glow"><i class="ico" style="width:40px;height:40px;"></i></div>
        <b>AK-47 | 红线 (久经沙场)</b>
        <span class="badge gold">稀有 · 参考 ¥ 168.00</span>
        <div class="row" style="gap:8px;margin-top:8px;">
          <button class="btn sm">存入我的奖品</button>
          <button class="btn ghost sm">取回到 Steam</button>
        </div>
      </div>
    </div>
    <nav class="tabbar">
      <a href="home.html"><i class="ico ico-home"></i>首页</a>
      <a class="on" href="product.html"><i class="ico ico-box"></i>商品</a>
      <a href="market.html"><i class="ico ico-chart"></i>行情</a>
      <a href="profile.html"><i class="ico ico-user"></i>我的</a>
    </nav>
  </div>
</div>
<script src="../theme.js"></script>
</body>
</html>
