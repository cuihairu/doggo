<!doctype html>
<html lang="zh-CN" data-theme="brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 手机端 状态图 — doggo</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .phone-duo { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div class="card row between" style="max-width:900px;margin:14px auto 10px;padding:8px 14px;">
  <span class="mini muted">手机端 · 关键流程状态图（每屏一态，两两并排）</span>
  <span class="row"><select class="theme-switch" aria-label="主题"></select><a class="mini" href="../index.html">返回索引</a></span>
</div>

<div class="phone-duo">
  <!-- 加载态 -->
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>doggo</span><span>◍</span></div>
    <div class="appbar"><b>商品列表</b></div>
    <div class="screen">
      <div class="state-tag">加载</div>
      <div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div>
      <p class="mini muted center">骨架屏占位，不发闪烁提示</p>
    </div>
    <nav class="tabbar"><a class="on" href="#"><i class="ico ico-box"></i>商品</a><a href="#"><i class="ico ico-user"></i>我的</a></nav>
  </div>

  <!-- 空态 -->
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>doggo</span><span>◍</span></div>
    <div class="appbar"><b>商品列表</b></div>
    <div class="screen center">
      <div class="state-tag">空态</div>
      <div class="empty"><i class="ico ico-box"></i><p><b>没有符合条件的商品</b></p><p class="mini muted">换个关键词，或清空筛选</p></div>
      <button class="btn ghost sm">清空筛选</button>
    </div>
    <nav class="tabbar"><a class="on" href="#"><i class="ico ico-box"></i>商品</a><a href="#"><i class="ico ico-user"></i>我的</a></nav>
  </div>

  <!-- 错误态 -->
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>doggo</span><span>◍</span></div>
    <div class="appbar"><b>确认订单</b></div>
    <div class="screen center">
      <div class="state-tag">错误</div>
      <div class="error-box"><i class="ico ico-warn"></i><p><b>支付未完成</b></p><p class="mini">渠道超时，订单已保留 14:32</p></div>
      <div class="row" style="gap:8px;"><button class="btn sm">重试支付</button><button class="btn ghost sm">返回详情</button></div>
    </div>
    <nav class="tabbar"><a class="on" href="#"><i class="ico ico-box"></i>商品</a><a href="#"><i class="ico ico-user"></i>我的</a></nav>
  </div>

  <!-- 成功态 -->
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>doggo</span><span>◍</span></div>
    <div class="appbar"><b>开箱结果</b></div>
    <div class="screen center">
      <div class="state-tag">成功</div>
      <div class="success-box"><i class="ico ico-check"></i><p><b>支付成功</b></p><p class="mini">¥ 10.80 · 正在开箱</p></div>
      <div class="open-glow" style="margin:10px auto;"><i class="ico" style="width:36px;height:36px;"></i></div>
      <b class="mini">AK-47 | 红线 (久经沙场)</b><br>
      <button class="btn sm" style="margin-top:8px;">查看奖品</button>
    </div>
    <nav class="tabbar"><a class="on" href="#"><i class="ico ico-box"></i>商品</a><a href="#"><i class="ico ico-user"></i>我的</a></nav>
  </div>
</div>

<p class="mini muted center" style="max-width:760px;margin:14px auto;">切换右上角主题验证：11 套主题下四态组件（骨架/空/错/成）布局与语义不变，仅颜色与图案随令牌变化。</p>
<script src="../theme.js"></script>
</body>
</html>
