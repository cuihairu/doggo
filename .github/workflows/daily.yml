name: Daily build

on:
  schedule:
    # 02:23 Asia/Shanghai
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip when the repo has been idle for 48 hours
        id: check
        run: |
          # Manual runs always build; scheduled runs only build on recent activity.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_hours=$(( (now - last_commit) / 3600 ))
          echo "last commit ${age_hours}h ago"

          if [ "$age_hours" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build server/Doggo.slnx

      - name: Test
        run: dotnet test server/Doggo.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Publish API
        run: dotnet publish server/src/Doggo.Api --configuration Release --no-restore --no-build -o artifacts/Doggo.Api

      - name: Publish scraper
        run: dotnet publish server/src/Doggo.Scraper --configuration Release --no-restore --no-build -o artifacts/Doggo.Scraper

      - name: Package
        run: |
          tar -czf doggo-publish-${{ github.sha }}.tar.gz -C artifacts .

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doggo-publish
          path: doggo-publish-*.tar.gz
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doggo-docs
          path: docs/.vitepress/dist
          retention-days: 14

  # Container images to GHCR under rolling nightly tags. Versioned releases
  # are a separate, manual, user-triggered step — never automated here.
  images:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: server
            dockerfile: server/Dockerfile
            target: app
            build-args: ""
          - name: scraper
            context: server
            dockerfile: server/Dockerfile.worker
            target: ""
            build-args: PROJECT=Doggo.Scraper
          - name: worker
            context: server
            dockerfile: server/Dockerfile.worker
            target: ""
            build-args: PROJECT=Doggo.Worker
          - name: web
            context: web
            dockerfile: web/Dockerfile
            target: ""
            build-args: ""
          - name: admin
            context: admin
            dockerfile: admin/Dockerfile
            target: ""
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/doggo-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:nightly
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Opt-in nightly rollout. Requires repo variable DEPLOY_ENABLED=true and the
  # DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY secrets.
  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Roll out nightly stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/doggo
            docker compose -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.prod.yml up -d
            docker image prune -f
