name: Daily build

on:
  schedule:
    # 02:23 Asia/Shanghai
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip when the repo has been idle for 48 hours
        id: check
        run: |
          # Manual runs always build; scheduled runs only build on recent activity.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_hours=$(( (now - last_commit) / 3600 ))
          echo "last commit ${age_hours}h ago"

          if [ "$age_hours" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build server/Doggo.slnx

      - name: Test
        run: dotnet test server/Doggo.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Publish API
        run: dotnet publish server/src/Doggo.Api --configuration Release --no-restore --no-build -o artifacts/Doggo.Api

      - name: Publish scraper
        run: dotnet publish server/src/Doggo.Scraper --configuration Release --no-restore --no-build -o artifacts/Doggo.Scraper

      - name: Package
        run: |
          tar -czf doggo-publish-${{ github.sha }}.tar.gz -C artifacts .

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doggo-publish
          path: doggo-publish-*.tar.gz
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.skip != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doggo-docs
          path: docs/.vitepress/dist
          retention-days: 14
